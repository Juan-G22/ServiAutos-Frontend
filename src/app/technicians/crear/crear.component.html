<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">➕ Nuevo Técnico</h1>
      <p class="text-gray-600">Agregar un nuevo técnico al equipo</p>
    </div>

    <!-- Mensajes -->
    <div *ngIf="successMessage" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="crearTecnico()" class="bg-white rounded-lg shadow-lg p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Nombre -->
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Nombre Completo <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            [(ngModel)]="tecnico.name"
            name="name"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ej: Miguel Rodríguez"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            [(ngModel)]="tecnico.email"
            name="email"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="miguel@serviautos.com"
          />
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Teléfono <span class="text-red-500">*</span>
          </label>
          <input
            type="tel"
            [(ngModel)]="tecnico.phone"
            name="phone"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="+57 300 123 4567"
          />
        </div>

        <!-- Especialización -->
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Especialización <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            [(ngModel)]="tecnico.specialization"
            name="specialization"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ej: Motor y Transmisión"
            list="specializations"
          />
          <datalist id="specializations">
            <option value="Motor y Transmisión">
            <option value="Sistema Eléctrico y Electrónico">
            <option value="Frenos y Suspensión">
            <option value="Aire Acondicionado">
            <option value="Diagnóstico General">
            <option value="Carrocería y Pintura">
            <option value="Mecánica General">
            <option value="Sistema de Inyección">
          </datalist>
        </div>

        <!-- Estado (Activo por defecto) -->
        <div class="col-span-2">
          <label class="flex items-center space-x-3">
            <input
              type="checkbox"
              [(ngModel)]="tecnico.isActive"
              name="isActive"
              class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
            />
            <span class="text-sm font-medium text-gray-700">Técnico Activo</span>
          </label>
          <p class="text-xs text-gray-500 mt-1 ml-8">
            Los técnicos activos pueden ser asignados a órdenes de servicio
          </p>
        </div>

      </div>

      <!-- Botones -->
      <div class="flex gap-4 mt-8">
        <button
          type="submit"
          [disabled]="loading"
          class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ loading ? 'Guardando...' : '💾 Guardar Técnico' }}
        </button>
        <button
          type="button"
          (click)="cancelar()"
          [disabled]="loading"
          class="flex-1 px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          ❌ Cancelar
        </button>
      </div>

      <p class="text-sm text-gray-500 mt-4 text-center">
        Los campos marcados con <span class="text-red-500">*</span> son obligatorios
      </p>
    </form>
  </div>
</div>

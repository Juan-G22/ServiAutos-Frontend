<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <button
        routerLink="/vehiculos"
        class="mb-4 px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition font-semibold"
      >
        ← Volver a Vehículos
      </button>
      <h1 class="text-4xl font-bold text-gray-800 mb-2">✏️ Editar Vehículo</h1>
      <p class="text-gray-600">Actualiza la información del vehículo</p>
    </div>

    <!-- Mensajes -->
    <div *ngIf="successMessage" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Cargando vehículo...</p>
    </div>

    <!-- Formulario -->
    <div *ngIf="!loading" class="bg-white rounded-lg shadow-lg p-8">
      <form (ngSubmit)="actualizarVehiculo()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Placa -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Placa *</label>
            <input
              [(ngModel)]="vehiculo.licencePlate"
              name="licencePlate"
              type="text"
              placeholder="Ej: ABC-123"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
              required
            />
          </div>

          <!-- Marca -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Marca *</label>
            <input
              [(ngModel)]="vehiculo.brand"
              name="brand"
              type="text"
              placeholder="Ej: Toyota"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required
            />
          </div>

          <!-- Modelo -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Modelo *</label>
            <input
              [(ngModel)]="vehiculo.model"
              name="model"
              type="text"
              placeholder="Ej: Corolla 2020"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required
            />
          </div>

          <!-- Cliente -->
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-2">Propietario *</label>
            <select
              [(ngModel)]="vehiculo.clientId"
              name="clientId"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              required
            >
              <option value="" disabled>Selecciona un cliente...</option>
              <option *ngFor="let cliente of clientes" [value]="cliente.id || cliente._id">
                {{ cliente.name }} {{ cliente.lastName }} ({{ cliente.document }})
              </option>
            </select>
          </div>
        </div>

        <!-- Botones -->
        <div class="mt-8 flex gap-4">
          <button
            type="submit"
            class="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-lg hover:from-blue-700 hover:to-indigo-700 transition font-semibold shadow-lg"
          >
            💾 Actualizar Vehículo
          </button>
          <button
            type="button"
            routerLink="/vehiculos"
            class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition font-semibold"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

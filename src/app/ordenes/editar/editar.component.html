<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-800 mb-2">✏️ Editar Orden de Servicio</h1>
      <p class="text-gray-600">Actualizar información de la orden</p>
    </div>

    <!-- Mensajes -->
    <div *ngIf="successMessage" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
      {{ errorMessage }}
    </div>

    <!-- Loading -->
    <div *ngIf="loading && !form.clientId" class="bg-white rounded-lg shadow-lg p-12 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600">Cargando datos de la orden...</p>
    </div>

    <!-- Formulario -->
    <form *ngIf="!loading || form.clientId" (ngSubmit)="guardar()" class="bg-white rounded-lg shadow-lg p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Cliente -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Cliente <span class="text-red-500">*</span>
          </label>
          <select
            [(ngModel)]="form.clientId"
            name="clientId"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Seleccione un cliente...</option>
            <option *ngFor="let cliente of clientes" [value]="cliente.id">
              {{ cliente.name }} {{ cliente.lastName }}
            </option>
          </select>
        </div>

        <!-- Vehículo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Vehículo <span class="text-red-500">*</span>
          </label>
          <select
            [(ngModel)]="form.vehicleId"
            name="vehicleId"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Seleccione un vehículo...</option>
            <option *ngFor="let vehiculo of vehiculos" [value]="vehiculo.id">
              {{ vehiculo.licencePlate }} - {{ vehiculo.brand }} {{ vehiculo.model }}
            </option>
          </select>
        </div>

        <!-- Diagnóstico -->
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Diagnóstico <span class="text-red-500">*</span>
          </label>
          <textarea
            [(ngModel)]="form.diagnostic"
            name="diagnostic"
            required
            rows="4"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Descripción del problema o servicio a realizar..."
          ></textarea>
        </div>

        <!-- Técnico Asignado -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Técnico Asignado (Opcional)
          </label>
          <select
            [(ngModel)]="form.assignedTechnicianId"
            name="assignedTechnicianId"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Sin asignar</option>
            <option *ngFor="let tecnico of tecnicos" [value]="tecnico.id">
              {{ tecnico.name }} - {{ tecnico.specialization }}
            </option>
          </select>
        </div>

        <!-- Valor de Mano de Obra -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Valor Mano de Obra <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-500">$</span>
            <input
              type="number"
              [(ngModel)]="form.laborValue"
              name="laborValue"
              required
              min="0"
              step="1000"
              class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="0"
            />
          </div>
        </div>

      </div>

      <!-- Información adicional -->
      <div *ngIf="form.clientName || form.vehiclePlate" class="mt-6 p-4 bg-blue-50 rounded-lg">
        <h3 class="text-sm font-semibold text-gray-700 mb-2">ℹ️ Información Actual</h3>
        <div class="grid grid-cols-2 gap-4 text-sm">
          <div *ngIf="form.clientName">
            <span class="text-gray-600">Cliente actual:</span>
            <span class="font-semibold ml-2">{{ form.clientName }}</span>
          </div>
          <div *ngIf="form.vehiclePlate">
            <span class="text-gray-600">Vehículo actual:</span>
            <span class="font-semibold ml-2">{{ form.vehiclePlate }}</span>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex gap-4 mt-8">
        <button
          type="submit"
          [disabled]="loading"
          class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ loading ? 'Actualizando...' : '💾 Actualizar Orden' }}
        </button>
        <button
          type="button"
          (click)="cancelar()"
          [disabled]="loading"
          class="flex-1 px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          ❌ Cancelar
        </button>
      </div>

      <p class="text-sm text-gray-500 mt-4 text-center">
        Los campos marcados con <span class="text-red-500">*</span> son obligatorios
      </p>

      <div class="mt-6 text-center">
        <button
          type="button"
          [routerLink]="['/ordenes/detalle', id]"
          class="text-purple-600 hover:text-purple-800 font-semibold"
        >
          👁️ Ver detalles completos (técnicos, repuestos, etc.)
        </button>
      </div>
    </form>
  </div>
</div>
